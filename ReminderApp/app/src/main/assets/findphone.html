<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>查找手机</title>
<style>
  :root { --bg:#f6f6f8; --card:#fff; --fg:#1c1c1e; --muted:#6b6b70; --line:#dcdce0;
          --red:#d32f2f; --red-d:#b71c1c; --ok:#2e7d32; --err:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --card:#1e1e22; --fg:#f2f2f5; --muted:#a0a0a8; --line:#36363c;
            --ok:#81c784; --err:#ef9a9a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Microsoft YaHei", sans-serif;
         display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:420px; background:var(--card); border-radius:16px;
         padding:28px 24px; box-shadow:0 2px 12px rgba(0,0,0,.08); text-align:center; }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; text-align:left; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--line);
          border-radius:8px; background:transparent; color:var(--fg); }
  .row { display:flex; gap:8px; } .row input { flex:1; }
  .small { padding:8px 12px; font-size:14px; border-radius:8px; border:1px solid var(--line);
           background:transparent; color:var(--fg); cursor:pointer; white-space:nowrap; }
  .hint { text-align:left; font-size:12px; color:var(--muted); margin-top:4px; }
  #ring { margin:28px auto 16px; width:180px; height:180px; border-radius:50%; border:0;
          background:var(--red); color:#fff; font-size:24px; font-weight:600; cursor:pointer;
          box-shadow:0 6px 20px rgba(211,47,47,.35); transition:transform .1s, background .2s; }
  #ring:hover { background:var(--red-d); }
  #ring:active { transform:scale(.96); }
  #ring:disabled { opacity:.6; cursor:wait; }
  #ring.ringing { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 18px rgba(211,47,47,0); } }
  #stop { padding:10px 28px; font-size:16px; border-radius:8px; border:1px solid var(--line);
          background:transparent; color:var(--fg); cursor:pointer; }
  #msg { min-height:1.5em; margin-top:16px; font-size:14px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>查找手机</h1>
  <p class="sub">点击按钮，手机会以最大音量响铃（静音模式下也会响）</p>

  <div id="addrRow" hidden>
    <label for="addr">手机地址（留空则自动查找）</label>
    <div class="row">
      <input id="addr" placeholder="例如 192.168.1.23" autocomplete="off">
      <button class="small" id="scan">自动查找</button>
    </div>
    <div class="hint">首次使用会自动扫描家里的局域网，找到后会记住地址。</div>
  </div>
  <label for="pin">PIN 码</label>
  <input id="pin" inputmode="numeric" maxlength="6" placeholder="6 位数字" autocomplete="off">

  <button id="ring">让手机响铃</button><br>
  <button id="stop">停止响铃</button>
  <div id="msg"></div>
</main>

<script>
  // 同一份页面两种用法：
  // 1) 由手机直接提供（http://手机IP:8080），请求发往同源；
  // 2) 保存在电脑本地双击打开（file://）。此时不知道手机地址：
  //    优先用上次成功的地址，失败则扫描局域网，找到后记住。
  const PORT = 8080;
  const fromFile = location.protocol === 'file:';
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  if (fromFile) $('addrRow').hidden = false;
  $('addr').value = store.get('fp_addr');
  $('pin').value = store.get('fp_pin');

  function show(text, cls) { const m = $('msg'); m.textContent = text; m.className = cls || ''; }

  function normalize(a) {
    a = (a || '').trim().replace(/\/+$/, '');
    if (!a) return '';
    if (!/^https?:\/\//i.test(a)) a = 'http://' + a;
    if (!/:\d+$/.test(a)) a += ':' + PORT;
    return a;
  }

  function base() { return fromFile ? normalize($('addr').value) : ''; }

  async function fetchT(url, opts, ms) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try { return await fetch(url, { ...opts, cache: 'no-store', signal: ctrl.signal }); }
    finally { clearTimeout(t); }
  }

  // ---------- 局域网扫描 ----------
  // 熄屏深度休眠的手机 Wi‑Fi 响应可能要 1～3 秒，超时不能太短
  async function isPhone(origin) {
    try {
      const r = await fetchT(origin + '/api/ping', {}, 3500);
      return r.ok && (await r.json()).app === 'findphone';
    } catch (e) { return false; }
  }

  // 候选网段：上次的地址所在网段优先，其次是家用路由器常见网段
  function candidatePrefixes() {
    const list = [];
    const m = /(\d+\.\d+\.\d+)\.\d+/.exec(store.get('fp_addr') || $('addr').value);
    if (m) list.push(m[1]);
    list.push('192.168.1', '192.168.0', '192.168.31', '192.168.3', '192.168.2',
              '192.168.10', '192.168.50', '192.168.8', '10.0.0', '10.0.1', '172.16.0');
    return [...new Set(list)];
  }

  async function scan() {
    let found = null;
    for (const p of candidatePrefixes()) {
      show('正在查找手机：' + p + '.x …');
      const hosts = Array.from({ length: 254 }, (_, i) => `http://${p}.${i + 1}:${PORT}`);
      // 并发 128 个请求，一个网段约 7 秒
      for (let i = 0; i < hosts.length && !found; i += 128) {
        const batch = hosts.slice(i, i + 128);
        const res = await Promise.all(batch.map(isPhone));
        const k = res.indexOf(true);
        if (k >= 0) found = batch[k];
      }
      if (found) break;
    }
    if (found) {
      const addr = found.replace(/^http:\/\//, '').replace(':' + PORT, '');
      $('addr').value = addr;
      store.set('fp_addr', addr);
      show('找到手机：' + addr, 'ok');
    } else {
      show('没有找到手机。请确认手机和电脑在同一个 Wi‑Fi，且手机上已开启“查找手机”。', 'err');
    }
    return found;
  }

  // ---------- 调用手机接口 ----------
  // 返回 JSON；PIN 错误等返回 null；网络不通抛出 'net'
  async function call(method, path) {
    const pin = $('pin').value.trim();
    if (!pin) { show('请输入手机上显示的 PIN 码', 'err'); return null; }
    store.set('fp_pin', pin);
    let r;
    try { r = await fetchT(base() + path, { method, headers: { 'X-Pin': pin } }, 10000); }
    catch (e) { throw 'net'; }
    if (r.status === 401) { show('PIN 码不正确', 'err'); return null; }
    if (r.status === 429) { show('输错次数过多，请 1 分钟后再试', 'err'); return null; }
    if (!r.ok) { show('手机返回错误：' + r.status, 'err'); return null; }
    return r.json();
  }

  // 电脑本地打开时：地址为空或连不上 → 自动扫描后重试一次
  async function callWithDiscovery(method, path) {
    if (fromFile && !base()) { if (!(await scan())) return null; }
    try {
      return await call(method, path);
    } catch (e) {
      if (!fromFile) { show('连不上手机：请确认手机已开启“查找手机”', 'err'); return null; }
      show('上次的地址连不上，可能手机 IP 变了，正在重新查找…');
      if (!(await scan())) return null;
      try { return await call(method, path); }
      catch (e2) { show('连不上手机', 'err'); return null; }
    }
  }

  let pollTimer = null;
  function setRinging(on) {
    $('ring').classList.toggle('ringing', on);
    if (!on && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  $('ring').onclick = async () => {
    $('ring').disabled = true;
    show('正在发送…');
    const d = await callWithDiscovery('POST', '/api/ring');
    $('ring').disabled = false;
    if (!d) return;
    show('手机正在响铃，循着声音去找吧！', 'ok');
    setRinging(true);
    if (!pollTimer) pollTimer = setInterval(async () => {
      try {
        const s = await call('GET', '/api/status');
        if (s && !s.ringing) { setRinging(false); show('已停止响铃', 'ok'); }
      } catch (e) { /* 偶发网络抖动，忽略 */ }
    }, 2000);
  };

  $('stop').onclick = async () => {
    const d = await callWithDiscovery('POST', '/api/stop');
    if (d) { setRinging(false); show('已停止响铃', 'ok'); }
  };

  $('scan').onclick = () => scan();
</script>
</body>
</html>
